<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passport Photo Maker | 35x45mm</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f2f5f9;
  color:#222;
}

header{
  background:#1769aa;
  color:white;
  text-align:center;
  padding:20px;
}

header h1{
  font-size:26px;
  margin-bottom:6px;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  padding:22px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.upload{
  border:2px dashed #1769aa;
  padding:30px;
  text-align:center;
  border-radius:10px;
  background:#f8fbff;
}

.upload input{
  margin-top:15px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-top:20px;
}

.control{
  display:flex;
  flex-direction:column;
  gap:7px;
}

label{
  font-weight:bold;
}

select{
  padding:11px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
  background:white;
}

button{
  border:0;
  padding:13px 20px;
  border-radius:7px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  margin-top:18px;
  margin-right:8px;
}

.create{
  background:#1769aa;
  color:white;
}

.download{
  background:#198754;
  color:white;
}

.reset{
  background:#dc3545;
  color:white;
}

.workspace{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.preview{
  min-height:350px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#eee;
  border-radius:8px;
  overflow:hidden;
}

.preview img{
  max-width:100%;
  max-height:400px;
}

.sheet-area{
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:auto;
}

canvas{
  max-width:100%;
  height:auto;
  border:1px solid #aaa;
  background:white;
}

.info{
  margin-top:15px;
  padding:12px;
  background:#eef7ff;
  border-radius:7px;
  font-size:14px;
}

@media(max-width:750px){
  .workspace{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<h1>📷 Passport Photo Maker</h1>
<p>35 × 45 mm | Computer Center Tool</p>
</header>

<div class="container">

<div class="card">

<div class="upload">

<h2>📤 Photo Upload करें</h2>

<p style="margin-top:8px">
JPG या PNG फोटो चुनें
</p>

<input
type="file"
id="photoInput"
accept="image/jpeg,image/png"
>

</div>

<div class="controls">

<div class="control">
<label>Passport Size</label>

<select id="photoSize">
<option value="35x45">35 × 45 mm</option>
</select>
</div>

<div class="control">

<label>Background</label>

<select id="background">

<option value="original">Original</option>
<option value="white">White</option>
<option value="blue">Blue</option>

</select>

</div>

<div class="control">

<label>Copies</label>

<select id="copies">

<option value="3">3 Copies</option>
<option value="4">4 Copies</option>
<option value="6" selected>6 Copies</option>
<option value="8">8 Copies</option>
<option value="12">12 Copies</option>

</select>

</div>

<div class="control">

<label>Paper</label>

<select id="paper">

<option value="4x6">4 × 6 Inch</option>

</select>

</div>

<div class="control">

<label>Border</label>

<select id="border">

<option value="yes">Border ON</option>
<option value="no">Border OFF</option>

</select>

</div>

</div>

<div>

<button
class="create"
onclick="createSheet()">
✨ Create Sheet
</button>

<button
class="download"
onclick="downloadJPG()">
⬇️ Download JPG
</button>

<button
class="reset"
onclick="resetTool()">
🔄 Reset
</button>

</div>

<div class="info">

<b>Photo Size:</b> 35 × 45 mm<br>
<b>Paper:</b> 4 × 6 inch<br>
<b>Output:</b> High Quality JPG

</div>

</div>


<div class="workspace">

<div class="card">

<h3 style="margin-bottom:15px">
👤 Original Photo
</h3>

<div class="preview">

<img
id="previewImage"
style="display:none"
>

<span id="empty">
Photo upload करने के बाद यहाँ दिखाई देगी
</span>

</div>

</div>


<div class="card">

<h3 style="margin-bottom:15px">
🖨️ 4 × 6 Sheet Preview
</h3>

<div class="sheet-area">

<canvas
id="sheetCanvas"
width="1200"
height="1800">
</canvas>

</div>

</div>

</div>

</div>

<script>

let image = null;


/* =========================
   PHOTO UPLOAD
========================= */

document
.getElementById("photoInput")
.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file)return;

const reader=new FileReader();

reader.onload=function(event){

image=new Image();

image.onload=function(){

const preview=
document.getElementById("previewImage");

preview.src=event.target.result;

preview.style.display="block";

document.getElementById("empty")
.style.display="none";

};

image.src=event.target.result;

};

reader.readAsDataURL(file);

});


/* =========================
   CREATE SHEET
========================= */

function createSheet(){

if(!image){

alert("पहले फोटो upload करें।");

return;

}

const canvas=
document.getElementById("sheetCanvas");

const ctx=
canvas.getContext("2d");

const copies=
parseInt(
document.getElementById("copies").value
);

const background=
document.getElementById("background").value;

const border=
document.getElementById("border").value;


/*
4×6 inch at 300 DPI
= 1200 × 1800 pixels
*/

canvas.width=1200;
canvas.height=1800;


/* Paper background */

ctx.fillStyle="white";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/*
35×45mm at 300 DPI

35mm = 413px approx
45mm = 531px approx
*/

const photoW=413;
const photoH=531;


/* Gap */

const gap=25;


/*
Maximum columns
*/

let columns=2;

if(copies>=6){
columns=3;
}

if(copies>=12){
columns=4;
}


/*
Rows
*/

const rows=
Math.ceil(copies/columns);


/*
Total layout size
*/

const totalW=
columns*photoW+
(columns-1)*gap;

const totalH=
rows*photoH+
(rows-1)*gap;


/*
Center sheet
*/

const startX=
(canvas.width-totalW)/2;

const startY=
(canvas.height-totalH)/2;


/*
Draw photos
*/

for(let i=0;i<copies;i++){

const col=i%columns;

const row=Math.floor(i/columns);

const x=
startX+
col*(photoW+gap);

const y=
startY+
row*(photoH+gap);


/*
Photo clipping
*/

ctx.save();

ctx.beginPath();

ctx.rect(
x,
y,
photoW,
photoH
);

ctx.clip();


/*
Background
*/

if(background==="white"){

ctx.fillStyle="white";

ctx.fillRect(
x,
y,
photoW,
photoH
);

}

else if(background==="blue"){

ctx.fillStyle="#d9ecff";

ctx.fillRect(
x,
y,
photoW,
photoH
);

}


/*
Photo
*/

ctx.drawImage(
image,
x,
y,
photoW,
photoH
);

ctx.restore();


/*
Border
*/

if(border==="yes"){

ctx.strokeStyle="#222";

ctx.lineWidth=3;

ctx.strokeRect(
x,
y,
photoW,
photoH
);

}

}

}


/* =========================
   DOWNLOAD JPG
========================= */

function downloadJPG(){

if(!image){

alert("पहले photo upload करें।");

return;

}

createSheet();

const canvas=
document.getElementById("sheetCanvas");

const link=
document.createElement("a");

link.download=
"passport-photo-4x6.jpg";

link.href=
canvas.toDataURL(
"image/jpeg",
0.95
);

link.click();

}


/* =========================
   RESET
========================= */

function resetTool(){

image=null;

document
.getElementById("photoInput")
.value="";

document
.getElementById("previewImage")
.style.display="none";

document
.getElementById("empty")
.style.display="block";

const canvas=
document.getElementById("sheetCanvas");

const ctx=
canvas.getContext("2d");

ctx.fillStyle="white";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

}

</script>

</body>
</html>
