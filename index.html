<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Passport Photo Maker</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
}

header{
  background:#1769aa;
  color:white;
  text-align:center;
  padding:20px;
}

header h1{
  margin:0 0 7px;
  font-size:26px;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:15px;
}

.card{
  background:white;
  padding:22px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.upload{
  border:2px dashed #1769aa;
  padding:30px;
  text-align:center;
  border-radius:10px;
  background:#f8fbff;
}

.upload input{
  margin-top:15px;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:15px;
  margin-top:20px;
}

.control{
  display:flex;
  flex-direction:column;
  gap:7px;
}

select{
  padding:11px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:15px;
}

button{
  border:0;
  padding:13px 20px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  font-size:15px;
  margin-top:20px;
  margin-right:8px;
}

.create{
  background:#1769aa;
  color:white;
}

.download{
  background:#198754;
  color:white;
}

.reset{
  background:#dc3545;
  color:white;
}

.workspace{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.preview{
  min-height:350px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  border-radius:8px;
  overflow:hidden;
}

.preview img{
  max-width:100%;
  max-height:400px;
}

.canvasBox{
  width:100%;
  overflow:auto;
  text-align:center;
}

canvas{
  width:100%;
  max-width:600px;
  height:auto;
  border:1px solid #aaa;
  background:white;
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:7px;
  background:#eef7ff;
  font-size:14px;
}

@media(max-width:750px){
  .workspace{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
<h1>📷 Passport Photo Maker</h1>
<p>35 × 45 mm | 4 × 6 Inch | Computer Center</p>
</header>

<div class="container">

<div class="card">

<div class="upload">

<h2>📤 Photo Upload करें</h2>

<p>JPG या PNG फोटो चुनें</p>

<input
type="file"
id="photoInput"
accept="image/jpeg,image/png"
>

</div>


<div class="controls">

<div class="control">
<label>Photo Size</label>

<select id="photoSize">
<option value="35x45">35 × 45 mm</option>
</select>
</div>


<div class="control">
<label>Background</label>

<select id="background">
<option value="original">Original</option>
<option value="white">White</option>
<option value="blue">Blue</option>
</select>
</div>


<div class="control">
<label>Copies</label>

<select id="copies">
<option value="3">3 Copies</option>
<option value="4">4 Copies</option>
<option value="6" selected>6 Copies</option>
<option value="8">8 Copies</option>
<option value="12">12 Copies</option>
</select>
</div>


<div class="control">
<label>Paper Size</label>

<select id="paper">
<option value="4x6">4 × 6 Inch</option>
</select>
</div>


<div class="control">
<label>Border</label>

<select id="border">
<option value="yes">Border ON</option>
<option value="no">Border OFF</option>
</select>
</div>

</div>


<button class="create" onclick="createSheet()">
✨ Create Passport Sheet
</button>

<button class="download" onclick="downloadJPG()">
⬇️ Download JPG
</button>

<button class="reset" onclick="resetTool()">
🔄 Reset
</button>

<div class="status" id="status">
पहले फोटो upload करें।
</div>

</div>


<div class="workspace">

<div class="card">

<h3>👤 Original Photo</h3>

<div class="preview">

<img id="previewImage" style="display:none;">

<span id="emptyText">
Photo यहाँ दिखाई देगी
</span>

</div>

</div>


<div class="card">

<h3>🖨️ 4 × 6 Passport Sheet</h3>

<div class="canvasBox">

<canvas
id="sheetCanvas"
width="1200"
height="1800">
</canvas>

</div>

</div>

</div>

</div>


<script>

let sourceImage = null;


/* =========================
PHOTO UPLOAD
========================= */

document
.getElementById("photoInput")
.addEventListener("change", function(event){

const file = event.target.files[0];

if(!file){

return;

}

if(!file.type.startsWith("image/")){

alert("कृपया JPG या PNG फोटो चुनें।");

return;

}

const reader = new FileReader();

reader.onload = function(e){

const img = new Image();

img.onload = function(){

sourceImage = img;

const preview =
document.getElementById("previewImage");

preview.src = e.target.result;

preview.style.display = "block";

document
.getElementById("emptyText")
.style.display = "none";

document
.getElementById("status")
.innerText =
"Photo upload हो गई है। अब Create Passport Sheet दबाएँ।";

};

img.onerror = function(){

alert("Photo load नहीं हो सकी।");

};

img.src = e.target.result;

};

reader.readAsDataURL(file);

});


/* =========================
CALCULATE CENTER CROP
35:45 RATIO
========================= */

function getCrop(){

const targetRatio = 35 / 45;

const imageWidth = sourceImage.naturalWidth;
const imageHeight = sourceImage.naturalHeight;

const imageRatio =
imageWidth / imageHeight;

let cropWidth;
let cropHeight;
let cropX;
let cropY;

if(imageRatio > targetRatio){

/*
Image ज्यादा चौड़ी है
Width को crop करेंगे
*/

cropHeight = imageHeight;

cropWidth = imageHeight * targetRatio;

cropX =
(imageWidth - cropWidth) / 2;

cropY = 0;

}else{

/*
Image ज्यादा लंबी है
Height को crop करेंगे
*/

cropWidth = imageWidth;

cropHeight = imageWidth / targetRatio;

cropX = 0;

cropY =
(imageHeight - cropHeight) / 2;

}

return {
x:cropX,
y:cropY,
width:cropWidth,
height:cropHeight
};

}


/* =========================
DRAW PASSPORT PHOTO
========================= */

function drawPassportPhoto(
ctx,
x,
y,
width,
height
){

const crop = getCrop();

const background =
document.getElementById("background").value;

const border =
document.getElementById("border").value;


/*
Background
*/

if(background === "white"){

ctx.fillStyle = "#ffffff";

ctx.fillRect(
x,
y,
width,
height
);

}

else if(background === "blue"){

ctx.fillStyle = "#d9ecff";

ctx.fillRect(
x,
y,
width,
height
);

}


/*
Clip to passport rectangle
*/

ctx.save();

ctx.beginPath();

ctx.rect(
x,
y,
width,
height
);

ctx.clip();


/*
IMPORTANT:
यह image को stretch नहीं करेगा।
यह center crop करके passport ratio में draw करेगा।
*/

ctx.drawImage(
sourceImage,

crop.x,
crop.y,
crop.width,
crop.height,

x,
y,
width,
height
);

ctx.restore();


/*
Border
*/

if(border === "yes"){

ctx.strokeStyle = "#222";

ctx.lineWidth = 3;

ctx.strokeRect(
x,
y,
width,
height
);

}

}


/* =========================
CREATE SHEET
========================= */

function createSheet(){

if(!sourceImage){

alert("पहले फोटो upload करें।");

return false;

}

const canvas =
document.getElementById("sheetCanvas");

const ctx =
canvas.getContext("2d");


/*
4 × 6 inch
300 DPI
*/

const paperWidth = 1200;
const paperHeight = 1800;

canvas.width = paperWidth;
canvas.height = paperHeight;


/*
White paper
*/

ctx.fillStyle = "#ffffff";

ctx.fillRect(
0,
0,
paperWidth,
paperHeight
);


/*
35 × 45 mm
300 DPI

35mm ≈ 413px
45mm ≈ 531px
*/

const photoWidth = 413;
const photoHeight = 531;


/*
Copies
*/

const copies =
parseInt(
document.getElementById("copies").value
);


/*
Spacing
*/

const gap = 20;


/*
Calculate columns
*/

let columns = 2;

if(copies >= 6){

columns = 3;

}

if(copies >= 12){

columns = 4;

}


/*
Calculate rows
*/

const rows =
Math.ceil(copies / columns);


/*
Total size
*/

const totalWidth =
columns * photoWidth +
(columns - 1) * gap;

const totalHeight =
rows * photoHeight +
(rows - 1) * gap;


/*
Center on 4×6 paper
*/

const startX =
(paperWidth - totalWidth) / 2;

const startY =
(paperHeight - totalHeight) / 2;


/*
Draw every photo
*/

for(let i = 0; i < copies; i++){

const column =
i % columns;

const row =
Math.floor(i / columns);

const x =
startX +
column * (photoWidth + gap);

const y =
startY +
row * (photoHeight + gap);

drawPassportPhoto(
ctx,
x,
y,
photoWidth,
photoHeight
);

}


document
.getElementById("status")
.innerText =
copies +
" passport photos की 4×6 sheet तैयार है। Photo size: 35×45 mm.";

return true;

}


/* =========================
DOWNLOAD JPG
========================= */

function downloadJPG(){

if(!sourceImage){

alert("पहले photo upload करें।");

return;

}


/*
पहले sheet बनाओ
*/

const created = createSheet();

if(!created){

return;

}


const canvas =
document.getElementById("sheetCanvas");


/*
Convert canvas to JPG
*/

canvas.toBlob(
function(blob){

if(!blob){

alert("JPG बनाने में समस्या हुई।");

return;

}


const url =
URL.createObjectURL(blob);


/*
Download link
*/

const link =
document.createElement("a");

link.href = url;

link.download =
"passport-photo-4x6.jpg";

document.body.appendChild(link);

link.click();

document.body.removeChild(link);


/*
Memory cleanup
*/

setTimeout(
function(){

URL.revokeObjectURL(url);

},
1000
);


document
.getElementById("status")
.innerText =
"✅ JPG successfully download हो गई।";

},
"image/jpeg",
0.95
);

}


/* =========================
RESET
========================= */

function resetTool(){

sourceImage = null;

document
.getElementById("photoInput")
.value = "";


document
.getElementById("previewImage")
.style.display = "none";


document
.getElementById("emptyText")
.style.display = "block";


const canvas =
document.getElementById("sheetCanvas");

const ctx =
canvas.getContext("2d");

ctx.fillStyle = "#ffffff";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


document
.getElementById("status")
.innerText =
"पहले फोटो upload करें।";

}

</script>

</body>
</html>
